<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#254e42"><title>更新 Eight Hours</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f4ef;color:#25372f;font:15px/1.8 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;padding:36px 22px}main{max-width:450px;margin:8vh auto;background:#fffefa;border:1px solid #e6e7de;border-radius:24px;padding:30px}small{color:#7c8279;letter-spacing:2px}h1{font-size:26px;font-weight:600;margin:14px 0}p{color:#71816f;font-size:13px}button,a{display:block;text-align:center;border:0;border-radius:12px;background:#254e42;color:white;padding:14px 18px;font:inherit;width:100%;text-decoration:none;margin-top:18px;cursor:pointer}button:disabled{opacity:.55}a{background:#e8eee3;color:#254e42;font-size:13px}#status{background:#eef2e6;border-radius:10px;padding:12px;font-size:13px;margin-top:20px}</style></head><body><main><small>EIGHT HOURS · 更新助手</small><h1>暂停一下，也很好。</h1><p>新版加入暂停计时、存储用量、按日期删除和清空数据。更新只替换程序文件，已有记录与课表会保留。</p><div id="status" role="status">点击下方按钮，检查并应用最新版本。</div><button id="update">保留记录，更新应用</button><a href="./">返回时间账本</a><p>请保持联网。手机与朋友各自更新即可；不需要清除网站数据。</p></main><script>
const button=document.getElementById('update'),status=document.getElementById('status');
const waitWorker=worker=>new Promise((resolve,reject)=>{const timeout=setTimeout(()=>reject(Error('下载超时，请检查网络后重试')),45000);const check=()=>{if(worker.state==='installed'||worker.state==='activated'){clearTimeout(timeout);resolve();}else if(worker.state==='redundant'){clearTimeout(timeout);reject(Error('更新未完成，请重试'));}};worker.addEventListener('statechange',check);check();});
button.onclick=async()=>{button.disabled=true;try{if(!('serviceWorker'in navigator)||!window.isSecureContext)throw Error('请在 Safari 或 Chrome 中打开正式 HTTPS 网址');status.textContent='正在下载最新程序，已有记录保持不变…';const registration=await navigator.serviceWorker.register('sw.js',{updateViaCache:'none'});await registration.update();if(registration.installing)await waitWorker(registration.installing);if(registration.waiting){status.textContent='下载完成，正在应用新版…';await new Promise((resolve,reject)=>{const timeout=setTimeout(()=>reject(Error('应用更新超时，请关闭其他应用页面后重试')),20000);navigator.serviceWorker.addEventListener('controllerchange',()=>{clearTimeout(timeout);resolve();},{once:true});registration.waiting.postMessage({type:'SKIP_WAITING'});});}else await navigator.serviceWorker.ready;status.textContent='已更新，正在打开时间账本…';location.replace('./?updated=1.1.0');}catch(error){status.textContent=error.message;button.disabled=false;}};
</script></body></html>
